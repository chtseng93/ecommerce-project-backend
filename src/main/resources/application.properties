server.port=8083
#datasource
#spring.datasource.primary.jdbc-url=jdbc:mysql://localhost:3306/ecommerce_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
#datasource_docker
spring.datasource.primary.jdbc-url=jdbc:mysql://localhost:33061/ecommerce_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false
#datasource_docker
#spring.datasource.primary.jdbc-url=jdbc:mysql://db:3306/ecommerce_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.primary.username=${DB_USERNAME:root}
spring.datasource.primary.password=${DB_PASSWORD}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
#Product Photo Path
#product.file.path=D:/serverdata/ecommerce/product/
#product.file.path=D:/clientside/ecommerce-project-client/src/images/
#Product Photo Path Docker
product.file.path=/clientside/ecommerce-project-client/src/images/
#product.image.file.path=../../src/images/
#Background url docker
product.image.file.path=/images/
#log level
logging.level.root=INFO
#logging.file.name=ecommerce-app.log
#jwt
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-32chars!!}
jwt.expiration-minutes=60






